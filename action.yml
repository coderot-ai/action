name: coderot
description: Code health and AI attribution from your repo's history, on coderot.ai. No secret to configure.
inputs:
  titles:
    description: Send PR titles (and the subject of commits without a PR) to coderot
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 24
        # off: it caches the package manager a repo's package.json names (pnpm, yarn) and fails when that isn't installed
        package-manager-cache: false
    # the input reaches the script through env, never ${{ }} inside it
    - shell: bash
      run: npx -y @coderot-ai/cli@1 ci --out "$RUNNER_TEMP/coderot" ${CODEROT_TITLES:+--titles}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CODEROT_TITLES: ${{ inputs.titles == 'true' && 'true' || '' }}
